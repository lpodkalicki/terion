
name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build and Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgtest-dev \
            libgmock-dev

      - name: Configure CMake
        run: |
          cmake --fresh \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel 2

      - name: Run tests
        run: |
          ctest \
            --test-dir build \
            --build-config ${{ env.BUILD_TYPE }} \
            --output-on-failure \
            --parallel 2

      - name: Show CMake test logs on failure
        if: failure()
        run: |
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            sed -n '1,2000p' build/Testing/Temporary/LastTest.log
          fi
